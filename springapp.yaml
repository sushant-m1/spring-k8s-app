apiVersion: apps/v1
kind: Deployment

metadata:
  name: springapp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: springapp

  template:
    metadata:
      labels:
        app: springapp

    spec:
      containers:
      - name: springapp
        image: springapp:v1
        imagePullPolicy: Never

        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service

metadata:
  name: springapp

spec:
  type: NodePort

  selector:
    app: springapp

  ports:
  - port: 8080
    targetPort: 8080
